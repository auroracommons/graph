name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Extractor and eval harness tests
        run: python -m unittest discover -s tests -v
      - name: Run the labeled eval (rule based; LLM mode skips without a key)
        run: python scripts/evaluate_extraction.py --out /tmp/eval_results.json
